name: ci
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.4.1 }
      - name: Install arm64 compiler build dependencies
        if: runner.arch == 'ARM64'
        run: sudo apt-get update && sudo apt-get install -y cabal-install ghc zlib1g-dev libgmp-dev
      - run: node scripts/verify.cjs
      - run: node scripts/verify-provenance.cjs
